<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: sans-serif; }
        h1 { margin-bottom: 10px; }
        fieldset { 
            background-color: #E6E6FA; 
            border: 1px solid #ccc; 
            width: 500px;
            padding: 15px;
        }
        legend { font-weight: bold; }
        .field { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; text-align: right; margin-right: 10px; }
        input[type="text"], input[type="password"] { width: 250px; }
        textarea { width: 250px; height: 50px; vertical-align: top; }
    </style>
</head>
<body>

    <h1>Register</h1>

    <form action="processData.php" method="POST">
        <fieldset>
            <legend>Person Details</legend>
            
            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" size="31" id="surname"/>
            </div>
            
            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" size="31" id="email"/>
            </div>
            
            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" size="31" id="password"/>
            </div>
            
            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" cols="25" rows="2" id="address"></textarea>
            </div>
            
            <div class="field">
                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="-1" selected>[choose your state]</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>
            
            <div class="field">
                <input type="hidden" name="country" value="Australia"/>
            </div>
            
            <div class="field">
                <label for="gender">Gender</label>
                <input type="radio" name="gender" value="Male" id="gender_male"/>Male
                <input type="radio" name="gender" value="Female" id="gender_female"/>Female
            </div>
            
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" id="vegetarian" />
            </div>
            
            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit"/>
                <input type="reset" value="Reset" name="reset"/>
            </div>
            
        </fieldset>
    </form>

</body>
</html>
